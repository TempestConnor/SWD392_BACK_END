spring.application.name=Swd392Backend

# SQL Server connection; supply values through environment variables, never commit credentials.
spring.datasource.url=${CHESS_DB_URL}
spring.datasource.username=${CHESS_DB_USERNAME}
spring.datasource.password=${CHESS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Store Instant in the schema's datetime2 (UTC) columns instead of Hibernate's default datetimeoffset.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# JWT signing secret must be a base64-encoded key of at least 256 bits.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=swd392-backend
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}

# Stockfish executable (GPL-3, run as a separate UCI process); CPU moves return 503 until it is set.
app.engine.stockfish-path=${STOCKFISH_PATH:}
app.engine.pool-size=${ENGINE_POOL_SIZE:2}
app.engine.acquire-timeout=${ENGINE_ACQUIRE_TIMEOUT:PT5S}

# Pending online games (F07): a participant silent for this long cancels the game before start
# (product decision 2026-10-15); the sweeper also cancels games past their three-minute Ready deadline.
# The same interval drives the sweeper that records TIMEOUT results for active games (F09).
app.online-game.pending-heartbeat-timeout=${PENDING_HEARTBEAT_TIMEOUT:PT30S}
app.online-game.sweep-interval=${ONLINE_GAME_SWEEP_INTERVAL:PT5S}
app.online-game.sweep-enabled=${ONLINE_GAME_SWEEP_ENABLED:true}

# OpenAPI document at /v3/api-docs and Swagger UI at /swagger-ui.html; every @RestController is picked up automatically.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
