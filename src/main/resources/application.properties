spring.application.name=Swd392Backend

# SQL Server connection; supply values through environment variables, never commit credentials.
spring.datasource.url=${CHESS_DB_URL}
spring.datasource.username=${CHESS_DB_USERNAME}
spring.datasource.password=${CHESS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT signing secret must be a base64-encoded key of at least 256 bits.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=swd392-backend
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}

# Stockfish executable (GPL-3, run as a separate UCI process); CPU moves return 503 until it is set.
app.engine.stockfish-path=${STOCKFISH_PATH:}
app.engine.pool-size=${ENGINE_POOL_SIZE:2}
app.engine.acquire-timeout=${ENGINE_ACQUIRE_TIMEOUT:PT5S}
