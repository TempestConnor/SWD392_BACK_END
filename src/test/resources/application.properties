spring.application.name=Swd392Backend

# Tests start without a database; SQL Server integration tests opt in through CHESS_TEST_DB_* variables.
spring.datasource.url=${CHESS_TEST_DB_URL:jdbc:sqlserver://localhost;databaseName=ChessDB_Test;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${CHESS_TEST_DB_USERNAME:}
spring.datasource.password=${CHESS_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Store Instant in the schema's datetime2 (UTC) columns instead of Hibernate's default datetimeoffset.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Test-only signing key; never reuse outside tests.
app.jwt.secret=oR6X/z22C0jHH9SE55Clp2XT0fc1NP9DAr75NKLq59I=
app.jwt.issuer=swd392-backend
app.jwt.access-token-ttl=PT1H

# Stockfish tests opt in through STOCKFISH_PATH.
app.engine.stockfish-path=${STOCKFISH_PATH:}
app.engine.pool-size=2
app.engine.acquire-timeout=PT5S

# Tests drive pending-game cancellation directly instead of through the background sweeper.
app.online-game.pending-heartbeat-timeout=PT30S
app.online-game.sweep-interval=PT5S
app.online-game.sweep-enabled=false
